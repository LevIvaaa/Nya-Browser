<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      font-family: 'Inter var', 'Inter', 'Segoe UI Variable Text', 'Segoe UI', -apple-system, system-ui, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'ss01';
      -webkit-font-smoothing: antialiased;
      background: #0c0d12;
      color: #f2f3f7;
    }
    a { color: #7c6cff; text-decoration: none; }
    a:hover { color: #9c90ff; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; pointer-events: none; }
  </style>
</helmet>

<div style="position: relative; width: 640px; height: 400px; overflow: hidden; background: #0c0d12; display: flex; flex-direction: column;">

  <div class="blob" style="width: 320px; height: 320px; left: -90px; top: -120px; background: #7c6cff; opacity: 0.30;"></div>
  <div class="blob" style="width: 280px; height: 280px; right: -80px; top: -60px; background: #0a84ff; opacity: 0.16;"></div>
  <div class="blob" style="width: 300px; height: 200px; left: 40%; bottom: -150px; background: #e255a1; opacity: 0.10;"></div>

  <div style="position: relative; z-index: 1; display: flex; justify-content: flex-end; align-items: stretch; height: 34px;">
    <div data-nsis="close-x" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 34px; color: rgba(242, 243, 247, 0.62);">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M0.6 0.6l8.8 8.8M9.4 0.6L0.6 9.4" stroke="currentColor" stroke-width="1"></path>
      </svg>
    </div>
  </div>

  <div style="position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px;">
    <img src="nya-logo.png" alt="" style="width: 84px; height: 84px; filter: drop-shadow(0 12px 28px rgba(124, 108, 255, 0.45));">
    <div style="margin-top: 14px; font-size: 26px; line-height: 31px; font-weight: 600; letter-spacing: -0.02em;">Nya Browser</div>
    <div style="margin-top: 6px; font-size: 13.5px; line-height: 19px; color: rgba(242, 243, 247, 0.62); text-align: center; text-wrap: pretty;">Быстрый и приватный браузер</div>
    <button data-nsis="install" style="margin-top: 24px; height: 44px; padding: 0 34px; border: 0; border-radius: 12px; background: #7c6cff; color: #ffffff; font: 500 15px/1 'Inter var', 'Inter', 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 10px 26px -10px rgba(124, 108, 255, 0.85);">Установить</button>
  </div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 22px 16px; border-top: 1px solid rgba(255, 255, 255, 0.08);">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
        <div style="font-size: 11px; line-height: 15px; color: rgba(242, 243, 247, 0.38);">Папка установки</div>
        <div style="font-size: 12.5px; line-height: 17px; color: rgba(242, 243, 247, 0.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" data-nsis="path">C:\Users\Lev\AppData\Local\Programs\Nya Browser</div>
      </div>
      <button data-nsis="browse" style="height: 30px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: #f2f3f7; font: 500 12.5px/1 'Inter var', 'Inter', 'Segoe UI', system-ui, sans-serif; cursor: pointer;">Изменить</button>
    </div>

    <div style="display: flex; align-items: center; gap: 22px;">
      <div data-nsis="row-desktop" style="display: flex; align-items: center; gap: 8px;">
        <span data-nsis="box-desktop" style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 5px; background: #7c6cff; color: #ffffff;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
        </span>
        <span style="font-size: 12.5px; line-height: 17px; color: rgba(242, 243, 247, 0.62);">Ярлык на рабочем столе</span>
      </div>
      <div data-nsis="row-default" style="display: flex; align-items: center; gap: 8px;">
        <span data-nsis="box-default" style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 5px; background: #7c6cff; color: #ffffff;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
        </span>
        <span style="font-size: 12.5px; line-height: 17px; color: rgba(242, 243, 247, 0.62);">Сделать браузером по умолчанию</span>
      </div>
    </div>

    <div style="font-size: 11px; line-height: 15px; color: rgba(242, 243, 247, 0.38);">Версия 1.0.0 · открытый код</div>
  </div>
</div>
</x-dc>
</body>
</html>
